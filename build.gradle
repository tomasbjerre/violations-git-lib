plugins {
	id "se.bjurr.gradle.bundle-jar"
}

allprojects {
	javaExtension {
		javaVersion = 17
	}
}

project(":violations-git-lib-transitives") {
	dependencies {
		api "se.bjurr.violations:violations-lib:2.0.0"
		api "org.eclipse.jgit:org.eclipse.jgit:7.8.0.202609011348-r"
		api 'de.vandermeer:asciitable:0.3.2'
		api "com.fasterxml.jackson.core:jackson-core:2.22.2"
		api "com.fasterxml.jackson.core:jackson-databind:2.22.2"
		api "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.22.2"

		testImplementation "org.junit.jupiter:junit-jupiter:6.1.3"
		testRuntimeOnly "org.junit.platform:junit-platform-launcher"
		testImplementation "org.assertj:assertj-core:3.27.7"
		testImplementation 'org.slf4j:slf4j-simple:2.0.19'
	}
}

project(":violations-git-lib") {
	apply plugin: "se.bjurr.gradle.shadow"

	shadowExtension {
		relocate.set("org,com,se:se,de")
	}

	dependencies {
		implementation project(":violations-git-lib-transitives")
	}
}
