name: Test PAT push
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          token: ${{ secrets.RELEASE_PAT }}
      - uses: tomasbjerre/.github/.github/actions/git-bot-identity@master
      - name: Trivial push test
        shell: bash
        run: |
          echo "pat-push-test $(date -u +%s)" >> .pat-push-test
          git add .pat-push-test
          git commit -m "test: verify RELEASE_PAT can push to protected branch"
          git push origin master
